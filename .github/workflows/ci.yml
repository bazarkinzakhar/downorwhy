name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Code Verification (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download dependencies
        run: go mod download

      - name: Run vet (Static analysis)
        run: go vet ./...

      - name: Run unit tests
        run: go test ./... -race -cover

      - name: Check for vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build:
    name: Build & Package (CD)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build local binary
        run: go build -v ./...

      - name: Verify Dockerfile Build
        run: |
          if [ -f Dockerfile ]; then
            docker build -t downorwhy:test .
          else
            echo "Dockerfile not found, skipping container build step."
          fi
