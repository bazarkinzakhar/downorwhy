name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - run: go mod download
      - run: go vet ./...

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
        env:
          GOLANGCI_LINT_ALLOW_NEWER_GO: "1"

      - run: go test ./... -race -cover
      - run: go build ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
