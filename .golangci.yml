version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - goconst
    - gosec
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - unconvert
    - unparam
    - wastedassign
    - whitespace

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
    gosec:
      excludes:
        # G107 is inherent to a scanner: URLs are variable by design and are
        # validated by internal/core/url/safeurl.go before every request.
        - G107
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: error-strings
        - name: context-as-argument

  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - goconst
          - gosec
          - unparam

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/downorwhy/downorwhy
